databaseChangeLog:
#  create the event_publication table to store events that need to be published to the integration module via spring modulith events
  - changeSet:
      id: 5-create-event-publication-table
      author: bank-core-team
      changes:
        - createTable:
            tableName: event_publication
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: listener_id
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: serialized_event
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: publication_date
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: completion_date
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            tableName: event_publication
            indexName: idx_event_publication_completion_date
            columns:
              - column:
                  name: completion_date